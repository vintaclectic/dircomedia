services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dirco
      POSTGRES_PASSWORD: dirco
      POSTGRES_DB: dircomedia
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dirco"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - media_uploads:/tmp/dircomedia/uploads
    environment:
      - DATABASE_URL=postgresql+asyncpg://dirco:dirco@postgres:5432/dircomedia
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1

  worker-content:
    build: ./backend
    command: celery -A app.workers.celery_app worker -Q content -c 4 --loglevel=info
    env_file: ./backend/.env
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://dirco:dirco@postgres:5432/dircomedia
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1

  worker-video:
    build: ./backend
    command: celery -A app.workers.celery_app worker -Q video -c 2 --loglevel=info
    env_file: ./backend/.env
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app
      - media_uploads:/tmp/dircomedia/uploads
    environment:
      - DATABASE_URL=postgresql+asyncpg://dirco:dirco@postgres:5432/dircomedia
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1

  worker-distribution:
    build: ./backend
    command: celery -A app.workers.celery_app worker -Q distribution -c 4 --loglevel=info
    env_file: ./backend/.env
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://dirco:dirco@postgres:5432/dircomedia
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1

  celery-beat:
    build: ./backend
    command: celery -A app.workers.celery_app beat --loglevel=info
    env_file: ./backend/.env
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://dirco:dirco@postgres:5432/dircomedia
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000

volumes:
  postgres_data:
  media_uploads:
